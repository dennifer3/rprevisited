<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>RP Revisited media</title>
<!--
  The in-game media player (TVs, cinema screens, radios, the global player).
  Garry's Mod loads this page in a hidden browser per screen and draws it on
  the screen in the world. Hosted here, not loaded from the game, because
  YouTube and Twitch embeds need a real web address to play.

  ?p=youtube|twitch|soundcloud  &id=...  &t=start seconds  &v=volume 0-100
  The game calls rprSync(seconds, paused) and rprVolume(0-100) to keep it in
  step, and the page reports back through gmod.rprInfo(duration, title).
  Plain ES5 for older in-game browsers.
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  #player, #player iframe { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border: 0; }
  #note { position: absolute; left: 0; right: 0; top: 50%; margin-top: -20px; text-align: center;
    color: #a59f96; font: 600 28px/40px Bahnschrift, "Segoe UI", sans-serif; letter-spacing: 0.08em; }
</style>
</head>
<body>
<div id="player"></div>
<div id="note"></div>
<script>
(function () {
  function param(name) {
    var m = new RegExp("[?&]" + name + "=([^&]*)").exec(location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : "";
  }
  var provider = param("p"), id = param("id");
  var start = Math.max(0, parseFloat(param("t")) || 0);
  var volume = Math.max(0, Math.min(100, parseFloat(param("v")) || 0));
  var note = document.getElementById("note");
  var api = null; // { seek(s), pause(b), volume(v), time() }
  var pending = null; // a sync that arrived before the player was ready

  function report(duration, title) {
    try { if (window.gmod && gmod.rprInfo) gmod.rprInfo(Math.floor(duration || 0), String(title || "").substring(0, 120)); } catch (e) {}
  }
  function show(text) { note.innerHTML = ""; note.appendChild(document.createTextNode(text)); }

  window.rprVolume = function (v) {
    volume = Math.max(0, Math.min(100, Number(v) || 0));
    if (api) api.volume(volume);
  };
  // Seek only when it has drifted, so playback stays smooth.
  window.rprSync = function (seconds, paused) {
    if (!api) { pending = [seconds, paused]; return; }
    var now = api.time();
    if (now !== null && Math.abs(now - seconds) > 2.5) api.seek(seconds);
    api.pause(!!paused);
  };
  function ready() {
    api.volume(volume);
    if (pending) { window.rprSync(pending[0], pending[1]); pending = null; }
  }
  function load(src, onload) {
    var s = document.createElement("script");
    s.src = src; s.onload = onload; s.onerror = function () { show("COULDN'T LOAD THE PLAYER"); };
    document.head.appendChild(s);
  }

  if (provider === "youtube" && /^[\w-]{11}$/.test(id)) {
    window.onYouTubeIframeAPIReady = function () {
      var yt = new YT.Player("player", {
        videoId: id,
        playerVars: { autoplay: 1, controls: 0, start: Math.floor(start), disablekb: 1, fs: 0,
          modestbranding: 1, rel: 0, iv_load_policy: 3, playsinline: 1 },
        events: {
          onReady: function (e) {
            api = {
              seek: function (s) { yt.seekTo(s, true); },
              pause: function (b) { if (b) yt.pauseVideo(); else yt.playVideo(); },
              volume: function (v) { yt.unMute(); yt.setVolume(v); },
              time: function () { return yt.getCurrentTime(); }
            };
            ready();
            e.target.playVideo();
            var data = yt.getVideoData ? yt.getVideoData() : {};
            report(yt.getDuration(), data && data.title);
          },
          onError: function () { show("THIS VIDEO CAN'T BE PLAYED HERE"); }
        }
      });
    };
    load("https://www.youtube.com/iframe_api");
  } else if (provider === "twitch" && /^(v:\d+|[A-Za-z0-9_]{3,25})$/.test(id)) {
    load("https://player.twitch.tv/js/embed/v1.js", function () {
      var opts = { width: "100%", height: "100%", parent: [location.hostname], autoplay: true, muted: false };
      if (id.indexOf("v:") === 0) {
        opts.video = id.substring(2);
        opts.time = Math.floor(start) + "s";
      } else {
        opts.channel = id;
      }
      var tw = new Twitch.Player("player", opts);
      tw.addEventListener(Twitch.Player.READY, function () {
        api = {
          seek: function (s) { if (opts.video) tw.seek(s); },
          pause: function (b) { if (b) tw.pause(); else tw.play(); },
          volume: function (v) { tw.setMuted(false); tw.setVolume(v / 100); },
          time: function () { return opts.video ? tw.getCurrentTime() : null; }
        };
        ready();
        report(opts.video ? tw.getDuration() : 0, opts.video ? "Twitch VOD " + opts.video : id + " (live on Twitch)");
      });
    });
  } else if (provider === "soundcloud" && /^[\w-]+\/[\w-]+$/.test(id)) {
    var frame = document.createElement("iframe");
    frame.allow = "autoplay";
    frame.src = "https://w.soundcloud.com/player/?url=" + encodeURIComponent("https://soundcloud.com/" + id)
      + "&auto_play=true&visual=true&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false";
    document.getElementById("player").appendChild(frame);
    load("https://w.soundcloud.com/player/api.js", function () {
      var sc = SC.Widget(frame), position = start;
      sc.bind(SC.Widget.Events.PLAY_PROGRESS, function (e) { position = e.currentPosition / 1000; });
      sc.bind(SC.Widget.Events.READY, function () {
        api = {
          seek: function (s) { sc.seekTo(s * 1000); },
          pause: function (b) { if (b) sc.pause(); else sc.play(); },
          volume: function (v) { sc.setVolume(v); },
          time: function () { return position; }
        };
        ready();
        sc.seekTo(start * 1000);
        sc.play();
        sc.getDuration(function (ms) {
          sc.getCurrentSound(function (sound) { report(ms / 1000, sound && sound.title); });
        });
      });
    });
  } else {
    show("NO SIGNAL");
  }
})();
</script>
</body>
</html>
