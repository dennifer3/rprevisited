<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>RP Revisited: loading</title>
<!--
  Garry's Mod loading screen for RP Revisited.
  Set on the server (cfg/server.cfg):
    sv_loadingurl "https://dennifer3.github.io/rprevisited/loading/?map=%m"
  Gmod calls GameDetails, SetFilesTotal, SetFilesNeeded, DownloadingFile and
  SetStatusChanged below while you join. Open with ?demo to watch it fake a join.
  Plain ES5 and prefixed CSS on purpose: older Gmod builds use an old browser.
  The spiral is a stand-in until there's a real logo.
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: #09090b;
    color: #eee9e0;
    font-family: "Bahnschrift", "Segoe UI", Tahoma, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none;
    cursor: default;
  }
  .caps { text-transform: uppercase; letter-spacing: 0.12em; }
  .faint { color: #706c66; }
  .dim { color: #a59f96; }

  /* A faint vignette so the middle reads as lit */
  .vignette {
    position: fixed; left: 0; top: 0; right: 0; bottom: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(255,178,62,0.06) 0%, rgba(0,0,0,0) 45%, rgba(0,0,0,0.55) 100%);
  }

  /* Corner frame, like the game's selection brackets */
  .corner { position: fixed; width: 26px; height: 26px; border-color: rgba(255,178,62,0.55); border-style: solid; border-width: 0; }
  .c-tl { left: 28px; top: 28px; border-left-width: 2px; border-top-width: 2px; }
  .c-tr { right: 28px; top: 28px; border-right-width: 2px; border-top-width: 2px; }
  .c-bl { left: 28px; bottom: 28px; border-left-width: 2px; border-bottom-width: 2px; }
  .c-br { right: 28px; bottom: 28px; border-right-width: 2px; border-bottom-width: 2px; }

  .top { position: fixed; left: 72px; right: 72px; top: 40px; font-size: 13px; font-weight: 600; }
  .top .right { float: right; }

  /* The centre: spiral, then the mark */
  .center {
    position: fixed; left: 50%; top: 44%;
    width: 520px; margin-left: -260px;
    -webkit-transform: translateY(-50%); transform: translateY(-50%);
    text-align: center;
  }
  .logo { width: 220px; height: 220px; margin: 0 auto; position: relative; }
  .logo svg { width: 220px; height: 220px; display: block; overflow: visible; }
  .spin { -webkit-transform-origin: 100px 100px; transform-origin: 100px 100px;
    -webkit-animation: spin 14s linear infinite; animation: spin 14s linear infinite; }
  .spin-back { -webkit-transform-origin: 100px 100px; transform-origin: 100px 100px;
    -webkit-animation: spin 40s linear infinite reverse; animation: spin 40s linear infinite reverse; }
  .trail { fill: none; stroke: rgba(255,178,62,0.12); stroke-width: 2; }
  .draw {
    fill: none; stroke: #ffb23e; stroke-width: 3; stroke-linecap: round;
    stroke-dasharray: 990; stroke-dashoffset: 990;
    -webkit-animation: draw 5.2s ease-in-out infinite; animation: draw 5.2s ease-in-out infinite;
  }
  .ring { fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 1; }
  .ticks { fill: none; stroke: rgba(255,178,62,0.5); stroke-width: 2; stroke-dasharray: 2 13.7; }
  .core { fill: #ffb23e; -webkit-transform-origin: 100px 100px; transform-origin: 100px 100px;
    -webkit-animation: pulse 2.6s ease-in-out infinite; animation: pulse 2.6s ease-in-out infinite; }
  .halo { fill: rgba(255,178,62,0.18); -webkit-transform-origin: 100px 100px; transform-origin: 100px 100px;
    -webkit-animation: halo 2.6s ease-out infinite; animation: halo 2.6s ease-out infinite; }

  @-webkit-keyframes spin { from { -webkit-transform: rotate(0deg); } to { -webkit-transform: rotate(360deg); } }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @-webkit-keyframes draw { 0% { stroke-dashoffset: 990; } 50% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -990; } }
  @keyframes draw { 0% { stroke-dashoffset: 990; } 50% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -990; } }
  @-webkit-keyframes pulse { 0%, 100% { -webkit-transform: scale(1); } 50% { -webkit-transform: scale(1.35); } }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.35); } }
  @-webkit-keyframes halo { 0% { -webkit-transform: scale(0.6); opacity: 0.9; } 100% { -webkit-transform: scale(3.4); opacity: 0; } }
  @keyframes halo { 0% { transform: scale(0.6); opacity: 0.9; } 100% { transform: scale(3.4); opacity: 0; } }

  .mark { margin-top: 34px; display: inline-block; }
  .mark-tag { display: inline-block; background: #ffb23e; color: #120e08; font-weight: 700; font-size: 15px; padding: 5px 7px; margin-right: 10px; vertical-align: middle; }
  .mark-word { display: inline-block; font-weight: 700; font-size: 26px; vertical-align: middle; letter-spacing: 0.04em; }
  .server { margin-top: 12px; font-size: 14px; min-height: 18px; }

  /* Bottom: status, progress, tips */
  .bottom { position: fixed; left: 72px; right: 72px; bottom: 56px; }
  .status-row { overflow: hidden; font-size: 14px; font-weight: 600; margin-bottom: 10px; }
  .status { float: left; }
  .count { float: right; }
  .bar { position: relative; height: 6px; background: rgba(255,255,255,0.07); overflow: hidden; }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #ffb23e;
    -webkit-transition: width 0.4s ease; transition: width 0.4s ease; }
  .bar.waiting .fill { width: 22%; -webkit-animation: sweep 1.6s ease-in-out infinite; animation: sweep 1.6s ease-in-out infinite; }
  @-webkit-keyframes sweep { 0% { left: -22%; } 100% { left: 100%; } }
  @keyframes sweep { 0% { left: -22%; } 100% { left: 100%; } }
  .tickmarks { position: absolute; left: 0; top: 0; right: 0; bottom: 0;
    background-image: -webkit-linear-gradient(left, rgba(9,9,11,0.9) 2px, transparent 2px);
    background-image: linear-gradient(to right, rgba(9,9,11,0.9) 2px, transparent 2px);
    background-size: 10% 100%; }
  .file { margin-top: 10px; font-size: 13px; height: 16px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

  .tip { margin-top: 28px; font-size: 15px; min-height: 22px;
    -webkit-transition: opacity 0.5s ease; transition: opacity 0.5s ease; }
  .tip b { color: #ffb23e; font-weight: 700; margin-right: 10px; font-size: 13px; letter-spacing: 0.12em; }

  @media (max-width: 700px) {
    .top, .bottom { left: 24px; right: 24px; }
    .center { width: 300px; margin-left: -150px; }
    .corner { display: none; }
  }
</style>
</head>

  </div>

<script>
(function () {
  var TIPS = [
    "Press F4 for jobs, the shop and pretty much everything else.",
    "Every job pays on a timer. Pick one and you won't be broke for long.",
    "Press E on a dumpster. You might find health, ammo or crafting parts.",
    "Read /laws before you get yourself arrested.",
    "The Fence buys crafting parts. No questions asked.",
    "Win the election and you write the laws. Try not to die in office.",
    "Bet on a fair fight with the Duel Master. Same gear for both sides.",
    "The Courier Boss pays for packages delivered on time.",
    "No killing, robbing or raiding in spawn.",
    "Got a headset? VR is optional, and fully playable."
  ];

  function $(id) { return document.getElementById(id); }
  function setText(id, text) { $(id).innerHTML = ""; $(id).appendChild(document.createTextNode(text)); }

  var total = 0, needed = 0;

  function updateBar() {
    if (total > 0) {
      var done = Math.max(0, total - needed);
      $("bar").className = "bar";
      $("fill").style.width = Math.min(100, done / total * 100) + "%";
      setText("count", done + " / " + total + " files");
    }
  }

  // Called by Garry's Mod while joining.
  window.GameDetails = function (servername, serverurl, mapname, maxplayers, steamid, gamemode) {
    if (servername) setText("server", servername);
    if (mapname) setText("map", mapname + (maxplayers ? "   /   " + maxplayers + " slots" : ""));
  };
  window.SetFilesTotal = function (n) { total = Number(n) || 0; updateBar(); };
  window.SetFilesNeeded = function (n) { needed = Number(n) || 0; updateBar(); };
  window.DownloadingFile = function (name) {
    var parts = String(name || "").split("/");
    setText("file", "Downloading " + parts[parts.length - 1]);
  };
  window.SetStatusChanged = function (status) {
    setText("status", String(status || "").replace(/\.\.\.$/, ""));
    if (/sending client info|client info sent|starting lua/i.test(status)) {
      $("bar").className = "bar";
      $("fill").style.width = "100%";
      setText("file", "");
    }
  };

  // The map from the URL (sv_loadingurl ...?map=%m), before Gmod tells us.
  var m = /[?&]map=([^&]+)/.exec(location.search);
  if (m) setText("map", decodeURIComponent(m[1]));

  // Tips, one at a time, fading between them.
  var tipIndex = Math.floor(Math.random() * TIPS.length);
  function showTip() {
    var el = $("tip");
    el.style.opacity = 0;
    setTimeout(function () {
      el.innerHTML = "<b>TIP</b>";
      el.appendChild(document.createTextNode(TIPS[tipIndex]));
      el.style.opacity = 1;
      tipIndex = (tipIndex + 1) % TIPS.length;
    }, 500);
  }
  showTip();
  setInterval(showTip, 7000);

  // ?demo: pretend to join, for previewing in a normal browser.
  if (/[?&]demo/.test(location.search)) {
    GameDetails("RP Revisited | *New* Optional VR-RP | Crafting | Dueling", "", "rp_uptown_v4_b12_night", 64, "", "rprevisited");
    SetStatusChanged("Retrieving server info...");
    var files = ["materials/rpr/logo.png", "models/props/crate.mdl", "sound/rpr/coin.wav", "maps/rp_uptown_v4_b12_night.bsp", "lua/autorun/client/rpr.lua"];
    var t = 60, left = 60;
    setTimeout(function () {
      SetStatusChanged("Workshop Complete");
      SetFilesTotal(t); SetFilesNeeded(left);
      var timer = setInterval(function () {
        left = Math.max(0, left - 3);
        SetFilesNeeded(left);
        DownloadingFile(files[left % files.length]);
        if (left === 0) {
          clearInterval(timer);
          SetStatusChanged("Sending client info...");
          setTimeout(function () { location.reload(); }, 6000);
        }
      }, 450);
    }, 2500);
  }
})();
</script>
</body>
</html>
